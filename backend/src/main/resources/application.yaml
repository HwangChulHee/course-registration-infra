spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_registration}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
      initialization-fail-timeout: 60000
  flyway:
    connect-retries: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
app:
  token-hours: ${TOKEN_HOURS:8}
  local-seed-password: ${LOCAL_SEED_PASSWORD:}
